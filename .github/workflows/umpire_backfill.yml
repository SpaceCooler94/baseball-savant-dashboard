# .github/workflows/umpire_backfill.yml
#
# ONE-TIME (per season) umpire-zone-cache backfill, triggered manually from
# the GitHub website or app -- no local shell needed. Pulls the whole season
# of pitch-level Statcast in weekly chunks and commits umpire_cache.json.
# Direct mirror of zone_backfill.yml's structure -- same timeout, same
# concurrency group, same install/commit/retry pattern -- so this repo has
# one proven backfill shape, not two that can drift.
#
# STANDALONE, UNVERIFIED: umpire_zone.py's own header lists three things to
# check against this backfill's real output before wiring it into anything
# else (umpire-id column coverage, the id-vs-name join with
# situational.home_plate_umpire(), and 2026 ABS-challenge contamination).
# Running this workflow is itself the way to check the first one --
# umpire_coverage_cached() on the resulting cache is the answer.
#
# Safe to leave in the repo: it only runs when you press the button.

name: umpire-backfill

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Season opener (YYYY-MM-DD)"
        required: true
        default: "2026-03-26"

permissions:
  contents: write

concurrency:
  group: daily-board          # serialize with the daily run so pushes don't collide
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90       # a full season of chunked Statcast pulls is slow --
                              # same figure as zone_backfill.yml, same shape of work
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Same requirements.txt discipline as zone_backfill.yml -- one
        # dependency source, one set of versions, both environments. See that
        # workflow's comment for why an inline pin list caused a real outage.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill umpire cache
        run: python umpire_zone.py --backfill "${{ github.event.inputs.start_date }}"

      - name: Commit cache
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add umpire_cache.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "umpire cache backfill from ${{ github.event.inputs.start_date }} [skip ci]"
            git pull --rebase --autostash origin main
            git push || { git pull --rebase --autostash origin main; git push; }
          fi
