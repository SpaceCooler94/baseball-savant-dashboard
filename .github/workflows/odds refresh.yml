# .github/workflows/odds_refresh.yml
#
# Pulls real DraftKings/FanDuel milestone prices (HR and Hits, Over 0.5/1.5/
# 2.5) and patches the board with model-fair-vs-book-price and the actual
# computed edge at each book. See refresh_odds.py's header for the exact
# quota math this schedule assumes -- change the cron count and re-check that
# math together, they're not independent.
#
# COST AT THIS SCHEDULE: 2 credits/event x ~15 events x 3 runs/day
#   = ~90 credits/day, ~2,700/month. Comfortably inside the lowest paid tier
#   of The Odds API as of this writing -- confirm against your actual plan
#   before widening the schedule, since this number scales linearly with runs.
#
# Paired with the SAME three windows as lineup-refresh (11am/4:30pm/7:30pm
# ET) deliberately: odds are most useful once real lineups are known (the
# model's price at a given threshold depends on expectedPA, which lineup-
# refresh already updates first in the same window), and reusing the
# existing cadence avoids adding a fourth uncoordinated schedule that could
# race the other two.

name: odds-refresh

on:
  schedule:
    - cron: "5 15 * * *"     # 11:05am ET -- 5 min after lineup-refresh's 11:00 run
    - cron: "35 20 * * *"    # 4:35pm ET  -- 5 min after lineup-refresh's 4:30 run
    - cron: "35 23 * * *"    # 7:35pm ET  -- 5 min after lineup-refresh's 7:30 run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-board          # same group as build/lineup-refresh -- serializes pushes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch DK/FD odds + edge
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python refresh_odds.py

      - name: Commit board
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add daily_board.json
          if git diff --cached --quiet; then
            echo "No odds changes to commit"
          else
            git commit -m "odds $(TZ=America/New_York date +'%F %H:%M') [skip ci]"
            git pull --rebase --autostash origin main
            git push || { git pull --rebase --autostash origin main; git push; }
          fi
